name: Release

# Cut a release by tagging the commit: `npm run release -- patch` (or minor/major) bumps
# package.json, commits, tags vX.Y.Z and pushes. This workflow then builds the .vsix, attaches it
# to a GitHub Release with the matching CHANGELOG section as notes, and publishes to the VS Code
# Marketplace / Open VSX when the VSCE_PAT / OVSX_PAT repository secrets are set.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm run typecheck
      - run: npm test
      - run: npm run compile
      - run: npx vsce package --no-dependencies

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '
            /^## / { inside = index($0, "[" v "]") > 0; next }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $v; see the commit history." > notes.md
          fi
          cat notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" claude-session-hub-*.vsix \
            --title "Claude Session Hub ${{ steps.version.outputs.version }}" \
            --notes-file notes.md --verify-tag

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath claude-session-hub-*.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish claude-session-hub-*.vsix -p "$OVSX_PAT"
